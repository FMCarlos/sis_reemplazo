version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: solicitudes_app
    volumes:
      - ./laravel:/var/www
    networks:
      - solicitudes_net

  nginx:
    image: nginx:1.25-alpine
    container_name: solicitudes_nginx
    ports:
      - "8080:80"
    volumes:
      - ./laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - solicitudes_net

  mysql:
    image: mysql:8.0
    container_name: solicitudes_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: solicitudes
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - solicitudes_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sis_reemplazo_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
    - solicitudes_net

networks:
  solicitudes_net:

volumes:
  mysql_data: